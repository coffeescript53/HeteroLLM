name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recompute published summaries
        run: python3 scripts/demo.py
      - name: Linux host checks
        run: bash scripts/test-cpu.sh
      - name: Standalone C++ recorder
        run: bash scripts/test-recorder-cpu.sh
      - name: Build static portfolio
        run: python3 scripts/build-portfolio.py
